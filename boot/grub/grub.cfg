# Antenora live ISO boot menu — GRUB 2, BIOS + UEFI hybrid.

set default=0
set timeout=3
set timeout_style=hidden

insmod all_video
insmod gfxterm
insmod gfxmenu
loadfont unicode
terminal_output gfxterm

set theme=/boot/grub/theme/theme.txt

menuentry "Antenora Linux (live)" --class antenora {
    set gfxpayload=keep
    linux /antenora/vmlinuz boot=live quiet loglevel=3
    initrd /antenora/initramfs.img
}

menuentry "Antenora Linux (live, no frills)" --class antenora {
    set gfxpayload=text
    linux /antenora/vmlinuz boot=live
    initrd /antenora/initramfs.img
}
