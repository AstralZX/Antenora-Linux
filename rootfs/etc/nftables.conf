#!/usr/sbin/nft -f
# Antenora firewall — stateful, inbound blocked except SSH and ping.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        iif "lo" accept

        icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded, parameter-problem } accept
        icmpv6 type { echo-request, echo-reply, destination-unreachable, time-exceeded, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

        tcp dport 22 accept

        ip protocol igmp accept
        ip6 nexthdr icmpv6 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
