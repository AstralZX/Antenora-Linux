# Antenora Linux performance tuning
# The Ninth Circle runs lean.

# Cache: keep more dentry/inode cache in memory (kernel default is 100)
vm.vfs_cache_pressure = 50

# Swap: barely touch swap unless we truly must
vm.swappiness = 10

# NUMA balancing off — single-CCX latency is king
kernel.numa_balancing = 0

# Dirty pages: flush more aggressively for lower write latency
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Kernel watchdog off for pure throughput
kernel.watchdog_thresh = 0

# More network backlog
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 16384

# IPv4 tuning
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fin_timeout = 15

# UDP buffer tuning (PipeWire-friendly)
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# BBR congestion control
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
