name: build-iso

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Dante into the live root
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "-s -w" \
            -o iso-build/archiso/airootfs/usr/bin/dante ./cmd/dante

      - name: Build the ISO (Arch container)
        run: |
          docker run --privileged --rm \
            -v "$PWD":/work -w /work \
            archlinux/archlinux:latest bash -lc '
              set -euo pipefail
              pacman-key --init
              pacman -Sy --noconfirm --needed archiso
              mkdir -p dist/iso
              mkarchiso -v -w /tmp/antenora-archiso -o dist/iso iso-build/archiso
            '

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/iso/*.iso
          generate_release_notes: true

      - name: Upload ISO artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: antenora-iso
          path: dist/iso/*.iso
          retention-days: 7
