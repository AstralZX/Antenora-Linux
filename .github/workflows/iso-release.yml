name: build-iso

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cpio xz-utils \
            squashfs-tools xorriso grub-common

      - name: Build the ISO from source
        run: ./scripts/iso-build.sh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/iso/*.iso
          generate_release_notes: true

      - name: Upload ISO artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: antenora-iso
          path: dist/iso/*.iso
          retention-days: 7
